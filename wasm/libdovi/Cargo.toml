[package]
name = "jellyfin-webgpu-dolby-vision-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# quietvoid/dovi_tool rev 38adec045bf183c24df38149836c920398072281, patched as vendor/dolby_vision/PATCHES.md lists
dolby_vision = { path = "vendor/dolby_vision" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

