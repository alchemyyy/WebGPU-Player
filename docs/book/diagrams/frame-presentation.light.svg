<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1010px" preserveAspectRatio="none" style="width:952px;height:1010px;" version="1.1" viewBox="0 0 952 1010" width="952px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="212.0117" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="932.5063" x="6" y="6"/><path d="M102.709,6 L102.709,15.3516 L92.709,25.3516 L6,25.3516" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.709" x="9" y="20.4951">Pick the clock</text><ellipse cx="472.2532" cy="45.3516" fill="#8C391F" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><polygon fill="#D6D6CE" points="154.9685,75.3516,228.6902,75.3516,240.6902,87.3516,228.6902,99.3516,154.9685,99.3516,142.9685,87.3516,154.9685,75.3516" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.043" x="195.8293" y="111.8086">decoded PCM</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.7217" x="154.9685" y="92.6709">Audio route?</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="351.6587" x="16" y="133.3086"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.7915" x="26" y="156.8037">Worklet render time, corrected to physical output time</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.6587" x="26" y="173.1553">through getOutputTimestamp, re-anchors the MediaClock</text><polygon fill="#D6D6CE" points="513.7954,75.3516,513.7954,75.3516,525.7954,87.3516,513.7954,99.3516,513.7954,99.3516,501.7954,87.3516,513.7954,75.3516" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="517.7954" y="111.8086">native media</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="46.043" x="525.7954" y="84.7148">no audio</text><rect fill="#C7DAEB" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="252.2734" x="387.6587" y="133.3086"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.2734" x="397.6587" y="156.8037">The hidden audio element's currentTime</text><rect fill="#C7DAEB" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="268.5742" x="659.9321" y="136.9375"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5742" x="669.9321" y="160.4326">MediaClock alone, held while video starves</text><rect fill="none" height="776.6367" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="924.7563" x="21.875" y="228.0117"/><path d="M88.9595,228.0117 L88.9595,237.3633 L78.9595,247.3633 L21.875,247.3633" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0845" x="24.875" y="242.5068">Each tick</text><polygon fill="#D6D6CE" points="433.5896,308.3633,510.9167,308.3633,522.9167,320.3633,510.9167,332.3633,433.5896,332.3633,421.5896,320.3633,433.5896,308.3633" style="stroke:#8C391F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.3271" x="433.5896" y="325.6826">Page visible?</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="402.9158" y="317.7266">yes</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="36.0352" x="522.9167" y="317.7266">hidden</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="210.7217" x="199.6854" y="342.3633"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7217" x="209.6854" y="365.8584">rAF: controller.takeCurrentFrame</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="418.106" x="430.4071" y="342.3633"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.106" x="440.4071" y="365.8584">Host timer (25 ms in the Jellyfin host) takes and discards due frames,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.1504" x="440.4071" y="382.21">after 10 s, audio-clocked native decode suspends video</text><polygon fill="#D6D6CE" points="472.2532,401.0664,484.2532,413.0664,472.2532,425.0664,460.2532,413.0664,472.2532,401.0664" style="stroke:#8C391F;stroke-width:1;"/><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="347.3105" x="298.5979" y="445.0664"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.3105" x="308.5979" y="468.5615">takeFrame picks the newest frame at or before the clock,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.8843" x="308.5979" y="484.9131">older frames close and return their credits</text><polygon fill="#D6D6CE" points="61.375,517.7695,286.8247,517.7695,298.8247,529.7695,286.8247,541.7695,61.375,541.7695,49.375,529.7695,61.375,517.7695" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="178.0999" y="554.2266">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4497" x="61.375" y="535.0889">Frame more than 2 s behind the clock?</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="284.4497" x="31.875" y="576.8633"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.4497" x="41.875" y="600.3584">Discard and re-credit it, then start a video wait</text><polygon fill="#D6D6CE" points="348.3247,517.7695,576.6689,517.7695,588.6689,529.7695,576.6689,541.7695,348.3247,541.7695,336.3247,529.7695,348.3247,517.7695" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="466.4968" y="554.2266">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3442" x="348.3247" y="535.0889">Queue empty for 100 ms while playing?</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="588.6689" y="527.1328">no</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="119.7153" x="402.6392" y="576.8633"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7153" x="412.6392" y="600.3584">Start a video wait</text><rect fill="#CCE3CF" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="303.9624" x="608.6689" y="557.543"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.1016" x="618.6689" y="581.0381">presenter.presentDecodedFrame:</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.9624" x="618.6689" y="597.3896">external texture or raw planes, fused color WGSL</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="280.1079" x="620.5962" y="642.7656"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0635" x="630.5962" y="666.2607">VideoFrame closes after submit(),</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.1079" x="630.5962" y="682.6123">its credit returns after onSubmittedWorkDone</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="164.5044" x="390.001" y="785.0156"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5044" x="400.001" y="808.5107">Fail with playback-stalled</text><ellipse cx="472.2532" cy="859.6914" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="472.2532" cy="859.6914" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#D6D6CE" points="417.6951,735.4688,526.8113,735.4688,538.8113,747.4688,526.8113,759.4688,417.6951,759.4688,405.6951,747.4688,417.6951,735.4688" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="476.2532" y="771.9258">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1162" x="417.6951" y="752.7881">A wait lasted 10 s?</text><polygon fill="#D6D6CE" points="472.2532,264.3633,484.2532,276.3633,472.2532,288.3633,460.2532,276.3633,472.2532,264.3633" style="stroke:#8C391F;stroke-width:1;"/><polygon fill="#D6D6CE" points="423.4778,912.6914,521.0286,912.6914,533.0286,924.6914,521.0286,936.6914,423.4778,936.6914,411.4778,924.6914,423.4778,912.6914" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.0566" x="476.2532" y="949.1484">stop, seek, or fallback</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.5508" x="423.4778" y="930.0107">Session current?</text><text fill="#5C5A55" font-family="sans-serif" font-size