<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1133px" preserveAspectRatio="none" style="width:947px;height:1133px;" version="1.1" viewBox="0 0 947 1133" width="947px" zoomAndPan="magnify"><defs/><g><ellipse cx="496.6843" cy="15" fill="#3473AD" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#22405E" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="324.2114" x="334.5786" y="45"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5698" x="344.5786" y="68.4951">selectPlaybackAudio:</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2114" x="344.5786" y="84.8467">DefaultAudioStreamIndex, else the first audio stream</text><rect fill="#22405E" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="406.5024" x="293.4331" y="117.7031"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5024" x="303.4331" y="141.1982">Normalization gain G = 10^(dB / 20) from TrackGain or AlbumGain,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.3887" x="303.4331" y="157.5498">each falling back to the other; unity when Off or missing</text><polygon fill="#181B1D" points="355.4331,190.4063,637.9355,190.4063,649.9355,206.7578,637.9355,223.1094,355.4331,223.1094,343.4331,206.7578,355.4331,190.4063" style="stroke:#3473AD;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5024" x="355.4331" y="203.9014">AC-3 or E-AC-3, 2 or 6 channels, exactly 48 kHz,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.7788" x="355.4331" y="220.2529">and the MSE probe passed?</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="275.394" y="204.1211">native media</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.043" x="649.9355" y="204.1211">decoded PCM</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="324.9033" x="95.2861" y="233.1094"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2217" x="105.2861" y="256.6045">Worker remuxes the track to fMP4</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9033" x="105.2861" y="272.9561">(2 MiB or 2 s segments, 2 credits, at most 6 s ahead)</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="503.4756" x="6" y="305.8125"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.4756" x="16" y="329.3076">CustomDecodeNativeAudioBridge appends to a hidden audio element through MSE</text><rect fill="#1D3B2C" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="248.2744" x="133.6006" y="377.1641"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.2744" x="143.6006" y="400.6592">element.volume = min(volume^3 * G, 1)</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="398.1235" x="536.5691" y="233.1094"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.1235" x="546.5691" y="256.6045">Decode: WebCodecs or @mediabunny/ac3 in the decode worker,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.5088" x="546.5691" y="272.9561">or E-AC-3, DTS, TrueHD WASM in the audio decode worker</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="341.5786" x="564.8416" y="305.8125"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.6777" x="574.8416" y="329.3076">The decode worker sends packets or decoded samples</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.5786" x="574.8416" y="345.6592">in 40 ms batches, 4 in flight, to the audio decode worker</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="325.7285" x="572.7666" y="393.5156"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.7285" x="582.7666" y="417.0107">Bind the output stage to the decoded rate and layout,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.5151" x="582.7666" y="433.3623">and rebind on a later change</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="412.3105" x="529.4756" y="466.2188"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.3105" x="539.4756" y="489.7139">Reconcile timestamps within 2 s: fill gaps with silence, trim overlaps,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4688" x="539.4756" y="506.0654">a larger deviation fails as decode-failed</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="317.7114" x="576.7751" y="588.4688"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.7114" x="586.7751" y="611.9639">Stereo output: downmix with the selected algorithm,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.8169" x="586.7751" y="628.3154">5.1 or 7.1 output: map by channel name</text><polygon fill="#181B1D" points="602.6633,538.9219,868.5984,538.9219,880.5984,550.9219,868.5984,562.9219,602.6633,562.9219,590.6633,550.9219,602.6633,538.9219" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="739.6309" y="575.3789">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9351" x="602.6633" y="556.2412">Decoded layout differs from the output layout?</text><polygon fill="#181B1D" points="735.6309,661.1719,747.6309,673.1719,735.6309,685.1719,723.6309,673.1719,735.6309,661.1719" style="stroke:#3473AD;stroke-width:1;"/><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="137.0508" x="667.1055" y="705.1719"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0508" x="677.1055" y="728.667">Resample to 48 kHz</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="232.4243" x="619.4187" y="761.5234"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4243" x="629.4187" y="785.0186">Lookahead limiter (100 ms, -1 dBFS)</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="248.3315" x="611.4651" y="817.875"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3315" x="621.4651" y="841.3701">40 ms to 12000-frame chunks, 8 credits</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="348.0913" x="561.5852" y="874.2266"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0034" x="571.5852" y="897.7217">WorkletPCMProducer -&gt; AudioWorklet 2 s ring,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0913" x="571.5852" y="914.0732">over the channel CustomDecodeAudioBridge hands over</text><rect fill="#1D3B2C" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="252.6416" x="609.3101" y="946.9297"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.6416" x="619.3101" y="970.4248">Worklet gain = volume^3 * G, uncapped,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4897" x="619.3101" y="986.7764">clipped samples are counted</text><polygon fill="#181B1D" points="496.6843,1005.6328,508.6843,1017.6328,496.6843,1029.6328,484.6843,1017.6328,496.6843,1005.6328" style="stroke:#3473AD;stroke-width:1;"/><rect fill="#1D3B2C" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="352.3823" x="320.4932" y="1049.6328"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.3823" x="330.4932" y="1073.1279">WebGPUAudioOutputManager routes the sink (setSinkId)</text><ellipse cx="496.6843" cy="1116.9844" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="496.6843" cy="1116.9844" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="496.6843" x2="496.6843" y1="25" y2="45"/><polygon fill="#8FB3D4" points="492.6843,35,496.6843,45,500.6843,35,496.6843,39" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="496.6843" x2="496.6843" y1="97.7031" y2="117.7031"/><polygon fill="#8FB3D4" points="492.6843,107.7031,496.6843,117.7031,500.6843,107.7031,496.6843,111.7031" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="257.7378" x2="257.7378" y1="285.8125" y2="305.8125"/><polygon fill="#8FB3D4" points="253.7378,295.8125,257.7378,305.8125,261.7378,295.8125,257.7378,299.8125" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="257.7378" x2="257.7378" y1="342.1641" y2="377.1641"/><polygon fill="#8FB3D4" points="253.7378,367.1641,257.7378,377.1641,261.7378,367.1641,257.7378,371.1641" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="735.6309" x2="735.6309" y1="285.8125" y2="305.8125"/><polygon fill="#8FB3D4" points="731.6309,295.8125,735.6309,305.8125,739.6309,295.8125,735.6309,299.8125" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="735.6309" x2="735.6309" y1="358.5156" y2="393.5156"/><polygon fill="#8FB3D4" points="731.6309,383.5156,735.6309,393.5156,739.6309,383.5156,735.6309,387.5156" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="735.6309" x2="735.6309" y1="446.2188" y2="466.2188"/><polygon fill="#8FB3D4" points="731.6309,456.2188,735.6309,466.2188,739.6309,456.2188,735.6309,460.2188" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="735.6309" x2="735.6309" y1="562.9219" y2="588.4688"/><polygon fill="#8FB3D4" points="731.6309,578.4688,735.6309,588.4688,739.6309,578.4688,735.6309,582.4688" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="880.5984" x2="904.4866" y1="550.9219" y2="550.9219"/><polygon fill="#8FB3D4" points="900.4866,604.8203,904.4866,614.8203,908.4866,604.8203,904.4866,608.8203" style="stroke:#8FB3D4;stroke-width:1.5;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="904.4866" x2="904.4866" y1="550.9219" y2="673.1719"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="904.4866" x2="747.6309" y1="673.1719" y2="673.1719"/><polygon fill="#8FB3D4" points="757.6309,669.1719,747.6309,673.1719,757.6309,677.1719,753.6309,673.1719" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="735.6309" x2="735.6309" y1="641.1719" y2="661.1719"/><polygon fill="#8FB3D4" points="731.6309,651.1719