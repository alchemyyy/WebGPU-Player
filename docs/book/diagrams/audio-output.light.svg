<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1028px" preserveAspectRatio="none" style="width:989px;height:1028px;" version="1.1" viewBox="0 0 989 1028" width="989px" zoomAndPan="magnify"><defs/><g><ellipse cx="507.0262" cy="15" fill="#8C391F" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="324.2114" x="344.9205" y="45"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5698" x="354.9205" y="68.4951">selectPlaybackAudio:</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2114" x="354.9205" y="84.8467">DefaultAudioStreamIndex, else the first audio stream</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="406.5024" x="303.775" y="117.7031"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5024" x="313.775" y="141.1982">Normalization gain G = 10^(dB / 20) from TrackGain or AlbumGain,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.3887" x="313.775" y="157.5498">each falling back to the other; unity when Off or missing</text><polygon fill="#D6D6CE" points="365.775,190.4063,648.2775,190.4063,660.2775,206.7578,648.2775,223.1094,365.775,223.1094,353.775,206.7578,365.775,190.4063" style="stroke:#8C391F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5024" x="365.775" y="203.9014">AC-3 or E-AC-3, 2 or 6 channels, exactly 48 kHz,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.7788" x="365.775" y="220.2529">and the MSE probe passed?</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="285.736" y="204.1211">native media</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.043" x="660.2775" y="204.1211">decoded PCM</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="324.9033" x="95.2861" y="233.1094"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2217" x="105.2861" y="256.6045">Worker remuxes the track to fMP4</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9033" x="105.2861" y="272.9561">(2 MiB or 2 s segments, 2 credits, at most 6 s ahead)</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="503.4756" x="6" y="320.8125"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.4756" x="16" y="344.3076">CustomDecodeNativeAudioBridge appends to a hidden audio element through MSE</text><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="248.2744" x="133.6006" y="377.1641"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.2744" x="143.6006" y="400.6592">element.volume = min(volume^3 * G, 1)</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="453.6782" x="529.4756" y="233.1094"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.6782" x="539.4756" y="256.6045">Decode: WebCodecs, @mediabunny/ac3, or E-AC-3, DTS, TrueHD WASM</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="325.7285" x="593.4504" y="304.4609"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.7285" x="603.4504" y="327.9561">Bind the output stage to the decoded rate and layout,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.5151" x="603.4504" y="344.3076">and rebind on a later change</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="412.3105" x="550.1594" y="377.1641"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.3105" x="560.1594" y="400.6592">Reconcile timestamps within 2 s: fill gaps with silence, trim overlaps,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4688" x="560.1594" y="417.0107">a larger deviation fails as decode-failed</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="317.7114" x="597.459" y="499.4141"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.7114" x="607.459" y="522.9092">Stereo output: downmix with the selected algorithm,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.8169" x="607.459" y="539.2607">5.1 or 7.1 output: map by channel name</text><polygon fill="#D6D6CE" points="623.3472,449.8672,889.2822,449.8672,901.2822,461.8672,889.2822,473.8672,623.3472,473.8672,611.3472,461.8672,623.3472,449.8672" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="760.3147" y="486.3242">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9351" x="623.3472" y="467.1865">Decoded layout differs from the output layout?</text><polygon fill="#D6D6CE" points="756.3147,572.1172,768.3147,584.1172,756.3147,596.1172,744.3147,584.1172,756.3147,572.1172" style="stroke:#8C391F;stroke-width:1;"/><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="137.0508" x="687.7893" y="616.1172"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0508" x="697.7893" y="639.6123">Resample to 48 kHz</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="232.4243" x="640.1025" y="672.4688"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4243" x="650.1025" y="695.9639">Lookahead limiter (100 ms, -1 dBFS)</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="248.3315" x="632.1489" y="728.8203"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3315" x="642.1489" y="752.3154">40 ms to 12000-frame chunks, 8 credits</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="323.1196" x="594.7549" y="785.1719"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.1196" x="604.7549" y="808.667">CustomDecodeAudioBridge -&gt; AudioWorklet 2 s ring</text><rect fill="#CCE3CF" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="252.6416" x="629.9939" y="841.5234"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.6416" x="639.9939" y="865.0186">Worklet gain = volume^3 * G, uncapped,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4897" x="639.9939" y="881.3701">clipped samples are counted</text><polygon fill="#D6D6CE" points="507.0262,900.2266,519.0262,912.2266,507.0262,924.2266,495.0262,912.2266,507.0262,900.2266" style="stroke:#8C391F;stroke-width:1;"/><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="352.3823" x="330.8351" y="944.2266"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.3823" x="340.8351" y="967.7217">WebGPUAudioOutputManager routes the sink (setSinkId)</text><ellipse cx="507.0262" cy="1011.5781" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="507.0262" cy="1011.5781" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="507.0262" x2="507.0262" y1="25" y2="45"/><polygon fill="#4A3F39" points="503.0262,35,507.0262,45,511.0262,35,507.0262,39" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="507.0262" x2="507.0262" y1="97.7031" y2="117.7031"/><polygon fill="#4A3F39" points="503.0262,107.7031,507.0262,117.7031,511.0262,107.7031,507.0262,111.7031" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="257.7378" x2="257.7378" y1="285.8125" y2="320.8125"/><polygon fill="#4A3F39" points="253.7378,310.8125,257.7378,320.8125,261.7378,310.8125,257.7378,314.8125" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="257.7378" x2="257.7378" y1="357.1641" y2="377.1641"/><polygon fill="#4A3F39" points="253.7378,367.1641,257.7378,377.1641,261.7378,367.1641,257.7378,371.1641" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="756.3147" x2="756.3147" y1="269.4609" y2="304.4609"/><polygon fill="#4A3F39" points="752.3147,294.4609,756.3147,304.4609,760.3147,294.4609,756.3147,298.4609" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="756.3147" x2="756.3147" y1="357.1641" y2="377.1641"/><polygon fill="#4A3F39" points="752.3147,367.1641,756.3147,377.1641,760.3147,367.1641,756.3147,371.1641" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="756.3147" x2="756.3147" y1="473.8672" y2="499.4141"/><polygon fill="#4A3F39" points="752.3147,489.4141,756.3147,499.