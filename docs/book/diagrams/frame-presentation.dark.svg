<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1043px" preserveAspectRatio="none" style="width:954px;height:1043px;" version="1.1" viewBox="0 0 954 1043" width="954px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="212.0117" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="932.5063" x="6" y="6"/><path d="M102.709,6 L102.709,15.3516 L92.709,25.3516 L6,25.3516" fill="none" style="stroke:#4A5056;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.709" x="9" y="20.4951">Pick the clock</text><ellipse cx="472.2532" cy="45.3516" fill="#3473AD" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><polygon fill="#181B1D" points="154.9685,75.3516,228.6902,75.3516,240.6902,87.3516,228.6902,99.3516,154.9685,99.3516,142.9685,87.3516,154.9685,75.3516" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.043" x="195.8293" y="111.8086">decoded PCM</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.7217" x="154.9685" y="92.6709">Audio route?</text><rect fill="#22405E" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="351.6587" x="16" y="133.3086"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.7915" x="26" y="156.8037">Worklet render time, corrected to physical output time</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.6587" x="26" y="173.1553">through getOutputTimestamp, re-anchors the MediaClock</text><polygon fill="#181B1D" points="513.7954,75.3516,513.7954,75.3516,525.7954,87.3516,513.7954,99.3516,513.7954,99.3516,501.7954,87.3516,513.7954,75.3516" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="517.7954" y="111.8086">native media</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="46.043" x="525.7954" y="84.7148">no audio</text><rect fill="#22405E" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="252.2734" x="387.6587" y="133.3086"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.2734" x="397.6587" y="156.8037">The hidden audio element's currentTime</text><rect fill="#22405E" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="268.5742" x="659.9321" y="136.9375"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5742" x="669.9321" y="160.4326">MediaClock alone, held while video starves</text><rect fill="none" height="809.3398" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="928.3682" x="20.0691" y="228.0117"/><path d="M87.1536,228.0117 L87.1536,237.3633 L77.1536,247.3633 L20.0691,247.3633" fill="none" style="stroke:#4A5056;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0845" x="23.0691" y="242.5068">Each tick</text><polygon fill="#181B1D" points="433.5896,308.3633,510.9167,308.3633,522.9167,320.3633,510.9167,332.3633,433.5896,332.3633,421.5896,320.3633,433.5896,308.3633" style="stroke:#3473AD;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.3271" x="433.5896" y="325.6826">Page visible?</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="402.9158" y="317.7266">yes</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="36.0352" x="522.9167" y="317.7266">hidden</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="210.7217" x="199.6854" y="342.3633"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7217" x="209.6854" y="365.8584">rAF: controller.takeCurrentFrame</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="418.106" x="430.4071" y="342.3633"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.106" x="440.4071" y="365.8584">Host timer (25 ms in the Jellyfin host) takes and discards due frames,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.1504" x="440.4071" y="382.21">after 10 s, audio-clocked native decode suspends video</text><polygon fill="#181B1D" points="472.2532,401.0664,484.2532,413.0664,472.2532,425.0664,460.2532,413.0664,472.2532,401.0664" style="stroke:#3473AD;stroke-width:1;"/><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="431.8423" x="256.332" y="445.0664"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.3105" x="266.332" y="468.5615">takeFrame picks the newest frame at or before the clock,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.8423" x="266.332" y="484.9131">older frames close, or the worker releases them, and return their credits</text><polygon fill="#181B1D" points="59.5691,517.7695,285.0188,517.7695,297.0188,529.7695,285.0188,541.7695,59.5691,541.7695,47.5691,529.7695,59.5691,517.7695" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="176.2939" y="554.2266">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4497" x="59.5691" y="535.0889">Frame more than 2 s behind the clock?</text><rect fill="#4A2121" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="284.4497" x="30.0691" y="576.8633"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.4497" x="40.0691" y="600.3584">Discard and re-credit it, then start a video wait</text><polygon fill="#181B1D" points="346.5188,517.7695,574.863,517.7695,586.863,529.7695,574.863,541.7695,346.5188,541.7695,334.5188,529.7695,346.5188,517.7695" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="464.6909" y="554.2266">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3442" x="346.5188" y="535.0889">Queue empty for 100 ms while playing?</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="586.863" y="527.1328">no</text><rect fill="#4A2121" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="119.7153" x="400.8333" y="576.8633"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7153" x="410.8333" y="600.3584">Start a video wait</text><rect fill="#1D3B2C" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="307.5742" x="606.863" y="557.543"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.1016" x="616.863" y="581.0381">presenter.presentDecodedFrame:</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5742" x="616.863" y="597.3896">external texture or raw planes, fused color WGSL,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.2207" x="616.863" y="613.7412">on the page or by the worker's renderer</text><rect fill="#4F3B14" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="284.7671" x="618.2666" y="659.1172"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0635" x="628.2666" y="682.6123">VideoFrame closes after submit(),</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.7197" x="628.2666" y="698.9639">its credit returns after onSubmittedWorkDone,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.7671" x="628.2666" y="715.3154">and a worker frame's once its draw completed</text><rect fill="#4A2121" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="164.5044" x="390.001" y="817.7188"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5044" x="400.001" y="841.2139">Fail with playback-stalled</text><ellipse cx="472.2532" cy="892.3945" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="472.2532" cy="892.3945" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#181B1D" points="417.6951,768.1719,526.8113,768.1719,538.8113,780.1719,526.8113,792.1719,417.6951,792.1719,405.6951,780.1719,417.6951,768.1719" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="476.2532" y="804.6289">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1162" x="417.6951" y="785.4912">A wait lasted 10 s?</text><polygon fill="#181B1D" points="472.2532,264.3633,484.2532,276.3633,472.2532,288.3633,460.2532,276.3633,472.2532,264.3633" style="stroke:#3473AD;stroke-width:1;"/><polygon fill="#181B1D" points="423.4778,945.3945,521.0286,945.3945,533.0286,957.3945,521.0286,969.3945,423.4778,969.3945,411.4778,957.3945,423.4778,945.3945" style="stroke:#3473