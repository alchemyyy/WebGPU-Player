<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1584px" preserveAspectRatio="none" style="width:1292px;height:1584px;" version="1.1" viewBox="0 0 1292 1584" width="1292px" zoomAndPan="magnify"><title>Presentation pipeline</title><defs/><g><g class="title" data-source-line="3"><text fill="#262625" font-family="sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="182.0391" x="553.896" y="33.6855">Presentation pipeline</text></g><ellipse cx="506.3032" cy="58.6406" fill="#8C391F" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="none" height="680.8594" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="1015.5166" x="271.3145" y="78.6406"/><path d="M631.6543,78.6406 L631.6543,87.9922 L621.6543,97.9922 L271.3145,97.9922" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="350.3398" x="274.3145" y="93.1357">Plan time: route, preset, settings, or output size changes</text><path d="M647.9426,107.9922 L647.9426,146.7266 L627.9426,150.7266 L647.9426,154.7266 L647.9426,193.4609 A0,0 0 0 0 647.9426,193.4609 L904.4075,193.4609 A0,0 0 0 0 904.4075,193.4609 L904.4075,117.9922 L894.4075,107.9922 L647.9426,107.9922 A0,0 0 0 0 647.9426,107.9922" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M894.4075,107.9922 L894.4075,117.9922 L904.4075,117.9922 L894.4075,107.9922" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.457" x="653.9426" y="125.4492">Authorization renders this default chain</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.8066" x="653.9426" y="140.543">through the same planner and executor,</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.457" x="653.9426" y="155.6367">so a preset never changes the route;</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.832" x="653.9426" y="170.7305">the GPU decode route has none, and a host</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.4648" x="653.9426" y="185.8242">verifies a decoder package only if it chooses</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="243.2788" x="384.6638" y="124.375"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2788" x="394.6638" y="147.8701">BuiltinChains.createBuiltinChain(route)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.3179" x="394.6638" y="164.2217">fixed signal + default color functions</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="320.5742" x="346.0161" y="213.4609"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.5742" x="356.0161" y="236.9561">PassManifest.parsePassManifest(each user source)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="356.0161" y="253.3076">failure: header-invalid</text><path d="M751.292,276.1641 L751.292,360.1797 L731.292,364.1797 L751.292,368.1797 L751.292,452.1953 A0,0 0 0 0 751.292,452.1953 L1276.8311,452.1953 A0,0 0 0 0 1276.8311,452.1953 L1276.8311,286.1641 L1266.8311,276.1641 L751.292,276.1641 A0,0 0 0 0 751.292,276.1641" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M1266.8311,276.1641 L1266.8311,286.1641 L1276.8311,286.1641 L1266.8311,276.1641" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="60.0293" x="757.292" y="293.6211">Self-check</text><ellipse cx="762.792" cy="303.8516" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="333.5215" x="769.292" y="308.7148">No user passes: one pass, byte-identical to the legacy shaders</text><ellipse cx="762.792" cy="318.9453" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.1172" x="769.292" y="323.8086">Color track: source -&gt; linear -&gt; display-linear -&gt; display</text><ellipse cx="762.792" cy="334.0391" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="404.5078" x="769.292" y="338.9023">A pass's domain pulls track steps before it; the rest fuse into the output pass</text><ellipse cx="762.792" cy="349.1328" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.7969" x="769.292" y="353.9961">Dither runs only in the pass that writes the canvas</text><ellipse cx="762.792" cy="364.2266" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="416.8652" x="769.292" y="369.0898">Kernels, compute, and user scalers read textures, so their input is materialized</text><ellipse cx="762.792" cy="379.3203" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="359.5254" x="769.292" y="384.1836">The built-in bilinear scaler over the signal fuses into the source read</text><ellipse cx="762.792" cy="394.4141" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="381.1699" x="769.292" y="399.2773">X[-N] gives X a ring of N + 1 textures; history never holds a VideoFrame</text><ellipse cx="762.792" cy="409.5078" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="398.8535" x="769.292" y="414.3711">A bypassing signal (Profile 4) completes the track to display in its own pass</text><ellipse cx="762.792" cy="424.6016" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="370.8926" x="769.292" y="429.4648">A pass that cannot run is left out with a reason code and a terse detail</text><ellipse cx="762.792" cy="439.6953" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="492.5391" x="769.292" y="444.5586">An interlaced stream deinterlaces before every stage, over the signal's ring of 3 at frame size</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="449.9775" x="281.3145" y="346.0039"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.9775" x="291.3145" y="369.499">PresentationPlanner.planPresentation(chain, passes, facts, device, output)</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="373.3613" x="319.6226" y="472.1953"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.0425" x="329.6226" y="495.6904">PassPrelude, per pass module</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.3613" x="329.6226" y="512.042">bindings, input accessors, renamed user bodies, entry stages</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="368.3213" x="322.1426" y="544.8984"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.0742" x="332.1426" y="568.3936">PresentationExecutor.create(device, plan)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.3213" x="332.1426" y="584.7451">shader modules, pipelines, rings, bind groups per ring phase</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="309.7578" x="351.4243" y="667.1484"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.7578" x="361.4243" y="690.6436">drop the named passes (compile-error) and replan</text><polygon fill="#D6D6CE" points="461.511,617.6016,551.0955,617.6016,563.0955,629.6016,551.0955,641.6016,461.511,641.6016,449.511,629.6016,461.511,617.6016" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="510.3032" y="654.0586">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.5845" x="461.511" y="634.9209">compile errors?</text><polygon fill="#D6D6CE" points="506.3032,723.5,518.3032,735.5,506.3032,747.5,494.3032,735.5,506.3032,723.5" style="stroke:#8C391F;stroke-width:1;"/><rect fill="none" height="767.1719" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="1030.6064" x="6" y="769.5"/><path d="M227.6943,769.5 L227.6943,778.8516 L217.6943,788.8516 L6,788.8516" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="211.6943" x="9" y="783.9951">Frame time: each presented frame</text><line style="stroke:#4A3F39;stroke-width:1.5;" x1="136.9163" x2="789.1221" y1="805.8516" y2="805.8516"/><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="237.8325" x="18" y="842.2031"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4917" x="28" y="865.6982">external route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8325" x="28" y="882.0498">VideoFrame -&gt; importExternalTexture</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="271.8052" x="265.8325" y="842.2031"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.0508" x="275.8325" y="865.6982">plane route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.8052" x="275.8325" y="882.0498">worker copy -&gt; writeTexture into uint planes</text><rect fill="#C7DAEB" height="85.4063" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="446.9688" x="565.6377" y="825.8516"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6753" x="575.6377" y="849.3467">GPU decode route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.9688" x="575.6377" y="865.6982">packet, or a package parser's record (coordinator worker + parse workers)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0605" x="575.6377" y="882.0498">-&gt; GPUVideoDecodeFeed, two packets in flight</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.8887" x="575.6377" y="898.4014">-&gt; GPUVideoDecodeSession compute -&gt; frame pool slot</text><line style="stroke:#4A3F39;stroke-width:1.5;" x1="136.9163" x2="789.1221" y1="931.2578" y2="931.2578"/><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="311.9414" x="350.3325" y="951.2578"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.646" x="360.3325" y="974.7529">PresentationExecutor.encode(encoder, frame)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.9414" x="360.3325" y="991.1045">one uniform write, one encode per pass, no submit</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="333.1426" x="339.7319" y="1023.9609"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1426" x="349.7319" y="1047.4561">SIGNAL, fixed and authorized: source -&gt; 'source' RGB</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="361.0723" x="325.7671" y="1129.8594"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.2671" x="335.7671" y="1153.3545">DEINTERLACE: yadif over the signal's frames [0], [-1], [-2]</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.0723" x="335.7671" y="1169.7061">the field DeinterlaceTimeline picks, one frame of lookahead</text><polygon fill="#D6D6CE" points="413.0879,1080.3125,599.5186,1080.3125,611.5186,1092.3125,599.5186,1104.3125,413.0879,1104.3125,401.0879,1092.3125,413.0879,1080.3125" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="510.3032" y="1116.7695">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4307" x="413.0879" y="1097.6318">interlaced stream, mode not off?</text><polygon fill="#D6D6CE" points="506.3032,1202.5625,518.3032,1214.5625,506.3032,1226.5625,494.3032,1214.5625,506.3032,1202.5625" style="stroke:#8C391F;stroke-width:1;"/><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="278.6733" x="366.9666" y="1246.5625"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6733" x="376.9666" y="1270.0576">RGB and PRESCALE passes, at source size</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="395.4004" x="308.603" y="1302.9141"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.4004" x="318.603" y="1326.4092">SCALE: built-in bilinear or one user scaler -&gt; the output rectangle</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="202.7935" x="404.9065" y="1359.2656"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7935" x="414.9065" y="1382.7607">OUTPUT passes, at output size</text><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="251.2261" x="380.6902" y="1415.6172"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2261" x="390.6902" y="1439.1123">remaining color steps + dither -&gt; canvas</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="275.0679" x="368.7693" y="1471.9688"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.1226" x="378.7693" y="1495.4639">presenter submits once</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0679" x="378.7693" y="1511.8154">new frames advance history, redraws do not</text><ellipse cx="506.3032" cy="1567.6719" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="506.3032" cy="1567.6719" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="506.3032" x2="506.3032" y1="177.0781" y2="213.4609"/><polygon fill="#4A3F39" points="502.3032,203.4609,506.3032,213.4609,510.3032,203.4609,506.3032,207.4609" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3