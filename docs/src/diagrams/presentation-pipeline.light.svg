<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1403px" preserveAspectRatio="none" style="width:1217px;height:1403px;" version="1.1" viewBox="0 0 1217 1403" width="1217px" zoomAndPan="magnify"><title>Presentation pipeline</title><defs/><g><g class="title" data-source-line="3"><text fill="#262625" font-family="sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="182.0391" x="516.0591" y="33.6855">Presentation pipeline</text></g><ellipse cx="506.3032" cy="58.6406" fill="#8C391F" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="none" height="665.7656" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="939.8428" x="271.3145" y="78.6406"/><path d="M631.6543,78.6406 L631.6543,87.9922 L621.6543,97.9922 L271.3145,97.9922" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="350.3398" x="274.3145" y="93.1357">Plan time: route, preset, settings, or output size changes</text><path d="M647.9426,107.9922 L647.9426,146.7266 L627.9426,150.7266 L647.9426,154.7266 L647.9426,193.4609 A0,0 0 0 0 647.9426,193.4609 L904.4075,193.4609 A0,0 0 0 0 904.4075,193.4609 L904.4075,117.9922 L894.4075,107.9922 L647.9426,107.9922 A0,0 0 0 0 647.9426,107.9922" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M894.4075,107.9922 L894.4075,117.9922 L904.4075,117.9922 L894.4075,107.9922" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.457" x="653.9426" y="125.4492">Authorization renders this default chain</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.8066" x="653.9426" y="140.543">through the same planner and executor,</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.457" x="653.9426" y="155.6367">so a preset never changes the route;</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.832" x="653.9426" y="170.7305">the GPU decode route has none, and a host</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.4648" x="653.9426" y="185.8242">verifies a decoder package only if it chooses</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="243.2788" x="384.6638" y="124.375"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2788" x="394.6638" y="147.8701">BuiltinChains.createBuiltinChain(route)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.3179" x="394.6638" y="164.2217">fixed signal + default color functions</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="320.5742" x="346.0161" y="213.4609"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.5742" x="356.0161" y="236.9561">PassManifest.parsePassManifest(each user source)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="356.0161" y="253.3076">failure: header-invalid</text><path d="M751.292,276.1641 L751.292,352.6328 L731.292,356.6328 L751.292,360.6328 L751.292,437.1016 A0,0 0 0 0 751.292,437.1016 L1201.1572,437.1016 A0,0 0 0 0 1201.1572,437.1016 L1201.1572,286.1641 L1191.1572,276.1641 L751.292,276.1641 A0,0 0 0 0 751.292,276.1641" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M1191.1572,276.1641 L1191.1572,286.1641 L1201.1572,286.1641 L1191.1572,276.1641" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="60.0293" x="757.292" y="293.6211">Self-check</text><ellipse cx="762.792" cy="303.8516" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="333.5215" x="769.292" y="308.7148">No user passes: one pass, byte-identical to the legacy shaders</text><ellipse cx="762.792" cy="318.9453" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.1172" x="769.292" y="323.8086">Color track: source -&gt; linear -&gt; display-linear -&gt; display</text><ellipse cx="762.792" cy="334.0391" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="404.5078" x="769.292" y="338.9023">A pass's domain pulls track steps before it; the rest fuse into the output pass</text><ellipse cx="762.792" cy="349.1328" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.7969" x="769.292" y="353.9961">Dither runs only in the pass that writes the canvas</text><ellipse cx="762.792" cy="364.2266" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="416.8652" x="769.292" y="369.0898">Kernels, compute, and user scalers read textures, so their input is materialized</text><ellipse cx="762.792" cy="379.3203" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="359.5254" x="769.292" y="384.1836">The built-in bilinear scaler over the signal fuses into the source read</text><ellipse cx="762.792" cy="394.4141" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="381.1699" x="769.292" y="399.2773">X[-N] gives X a ring of N + 1 textures; history never holds a VideoFrame</text><ellipse cx="762.792" cy="409.5078" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="398.8535" x="769.292" y="414.3711">A bypassing signal (Profile 4) completes the track to display in its own pass</text><ellipse cx="762.792" cy="424.6016" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="370.8926" x="769.292" y="429.4648">A pass that cannot run is left out with a reason code and a terse detail</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="449.9775" x="281.3145" y="338.457"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.9775" x="291.3145" y="361.9521">PresentationPlanner.planPresentation(chain, passes, facts, device, output)</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="373.3613" x="319.6226" y="457.1016"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.0425" x="329.6226" y="480.5967">PassPrelude, per pass module</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.3613" x="329.6226" y="496.9482">bindings, input accessors, renamed user bodies, entry stages</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="368.3213" x="322.1426" y="529.8047"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.0742" x="332.1426" y="553.2998">PresentationExecutor.create(device, plan)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.3213" x="332.1426" y="569.6514">shader modules, pipelines, rings, bind groups per ring phase</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="309.7578" x="351.4243" y="652.0547"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.7578" x="361.4243" y="675.5498">drop the named passes (compile-error) and replan</text><polygon fill="#D6D6CE" points="461.511,602.5078,551.0955,602.5078,563.0955,614.5078,551.0955,626.5078,461.511,626.5078,449.511,614.5078,461.511,602.5078" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="510.3032" y="638.9648">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.5845" x="461.511" y="619.8271">compile errors?</text><polygon fill="#D6D6CE" points="506.3032,708.4063,518.3032,720.4063,506.3032,732.4063,494.3032,720.4063,506.3032,708.4063" style="stroke:#8C391F;stroke-width:1;"/><rect fill="none" height="600.9219" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="1030.6064" x="6" y="754.4063"/><path d="M227.6943,754.4063 L227.6943,763.7578 L217.6943,773.7578 L6,773.7578" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="211.6943" x="9" y="768.9014">Frame time: each presented frame</text><line style="stroke:#4A3F39;stroke-width:1.5;" x1="136.9163" x2="789.1221" y1="790.7578" y2="790.7578"/><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="237.8325" x="18" y="827.1094"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4917" x="28" y="850.6045">external route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8325" x="28" y="866.9561">VideoFrame -&gt; importExternalTexture</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="271.8052" x="265.8325" y="827.1094"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.0508" x="275.8325" y="850.6045">plane route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.8052" x="275.8325" y="866.9561">worker copy -&gt; writeTexture into uint planes</text><rect fill="#C7DAEB" height="85.4063" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="446.9688" x="565.6377" y="810.7578"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6753" x="575.6377" y="834.2529">GPU decode route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.9688" x="575.6377" y="850.6045">packet, or a package parser's record (coordinator worker + parse workers)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7441" x="575.6377" y="866.9561">-&gt; GPUVideoDecodeFeed, one submission in flight</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.8887" x="575.6377" y="883.3076">-&gt; GPUVideoDecodeSession compute -&gt; frame pool slot</text><line style="stroke:#4A3F39;stroke-width:1.5;" x1="136.9163" x2="789.1221" y1="916.1641" y2="916.1641"/><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="311.9414" x="350.3325" y="936.1641"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.646" x="360.3325" y="959.6592">PresentationExecutor.encode(encoder, frame)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.9414" x="360.3325" y="976.0107">one uniform write, one encode per pass, no submit</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="333.1426" x="339.7319" y="1008.8672"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1426" x="349.7319" y="1032.3623">SIGNAL, fixed and authorized: source -&gt; 'source' RGB</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="278.6733" x="366.9666" y="1065.2188"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6733" x="376.9666" y="1088.7139">RGB and PRESCALE passes, at source size</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="395.4004" x="308.603" y="1121.5703"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.4004" x="318.603" y="1145.0654">SCALE: built-in bilinear or one user scaler -&gt; the output rectangle</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="202.7935" x="404.9065" y="1177.9219"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7935" x="414.9065" y="1201.417">OUTPUT passes, at output size</text><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="251.2261" x="380.6902" y="1234.2734"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2261" x="390.6902" y="1257.7686">remaining color steps + dither -&gt; canvas</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="275.0679" x="368.7693" y="1290.625"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.1226" x="378.7693" y="1314.1201">presenter submits once</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0679" x="378.7693" y="1330.4717">new frames advance history, redraws d