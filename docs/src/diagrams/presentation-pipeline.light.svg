<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1370px" preserveAspectRatio="none" style="width:1205px;height:1370px;" version="1.1" viewBox="0 0 1205 1370" width="1205px" zoomAndPan="magnify"><title>Presentation pipeline</title><defs/><g><g class="title" data-source-line="3"><text fill="#262625" font-family="sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="182.0391" x="510.2675" y="33.6855">Presentation pipeline</text></g><ellipse cx="494.72" cy="58.6406" fill="#8C391F" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="none" height="665.7656" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="939.8428" x="259.7312" y="78.6406"/><path d="M620.071,78.6406 L620.071,87.9922 L610.071,97.9922 L259.7312,97.9922" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="350.3398" x="262.7312" y="93.1357">Plan time: route, preset, settings, or output size changes</text><path d="M636.3594,107.9922 L636.3594,146.7266 L616.3594,150.7266 L636.3594,154.7266 L636.3594,193.4609 A0,0 0 0 0 636.3594,193.4609 L870.166,193.4609 A0,0 0 0 0 870.166,193.4609 L870.166,117.9922 L860.166,107.9922 L636.3594,107.9922 A0,0 0 0 0 636.3594,107.9922" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M860.166,107.9922 L860.166,117.9922 L870.166,117.9922 L860.166,107.9922" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.457" x="642.3594" y="125.4492">Authorization renders this default chain</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.8066" x="642.3594" y="140.543">through the same planner and executor,</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.457" x="642.3594" y="155.6367">so a preset never changes the route;</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.3984" x="642.3594" y="170.7305">a user decoder's vector check stands in</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162.7617" x="642.3594" y="185.8242">for it on the GPU decode route</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="243.2788" x="373.0806" y="124.375"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2788" x="383.0806" y="147.8701">BuiltinChains.createBuiltinChain(route)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.3179" x="383.0806" y="164.2217">fixed signal + default color functions</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="320.5742" x="334.4329" y="213.4609"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.5742" x="344.4329" y="236.9561">PassManifest.parsePassManifest(each user source)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="344.4329" y="253.3076">failure: header-invalid</text><path d="M739.7087,276.1641 L739.7087,352.6328 L719.7087,356.6328 L739.7087,360.6328 L739.7087,437.1016 A0,0 0 0 0 739.7087,437.1016 L1189.574,437.1016 A0,0 0 0 0 1189.574,437.1016 L1189.574,286.1641 L1179.574,276.1641 L739.7087,276.1641 A0,0 0 0 0 739.7087,276.1641" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M1179.574,276.1641 L1179.574,286.1641 L1189.574,286.1641 L1179.574,276.1641" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="60.0293" x="745.7087" y="293.6211">Self-check</text><ellipse cx="751.2087" cy="303.8516" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="333.5215" x="757.7087" y="308.7148">No user passes: one pass, byte-identical to the legacy shaders</text><ellipse cx="751.2087" cy="318.9453" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.1172" x="757.7087" y="323.8086">Color track: source -&gt; linear -&gt; display-linear -&gt; display</text><ellipse cx="751.2087" cy="334.0391" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="404.5078" x="757.7087" y="338.9023">A pass's domain pulls track steps before it; the rest fuse into the output pass</text><ellipse cx="751.2087" cy="349.1328" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.7969" x="757.7087" y="353.9961">Dither runs only in the pass that writes the canvas</text><ellipse cx="751.2087" cy="364.2266" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="416.8652" x="757.7087" y="369.0898">Kernels, compute, and user scalers read textures, so their input is materialized</text><ellipse cx="751.2087" cy="379.3203" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="359.5254" x="757.7087" y="384.1836">The built-in bilinear scaler over the signal fuses into the source read</text><ellipse cx="751.2087" cy="394.4141" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="381.1699" x="757.7087" y="399.2773">X[-N] gives X a ring of N + 1 textures; history never holds a VideoFrame</text><ellipse cx="751.2087" cy="409.5078" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="398.8535" x="757.7087" y="414.3711">A bypassing signal (Profile 4) completes the track to display in its own pass</text><ellipse cx="751.2087" cy="424.6016" fill="#262625" rx="2.5" ry="2.5"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="370.8926" x="757.7087" y="429.4648">A pass that cannot run is left out with a reason code and a terse detail</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="449.9775" x="269.7312" y="338.457"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.9775" x="279.7312" y="361.9521">PresentationPlanner.planPresentation(chain, passes, facts, device, output)</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="373.3613" x="308.0393" y="457.1016"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.0425" x="318.0393" y="480.5967">PassPrelude, per pass module</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.3613" x="318.0393" y="496.9482">bindings, input accessors, renamed user bodies, entry stages</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="368.3213" x="310.5593" y="529.8047"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.0742" x="320.5593" y="553.2998">PresentationExecutor.create(device, plan)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.3213" x="320.5593" y="569.6514">shader modules, pipelines, rings, bind groups per ring phase</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="309.7578" x="339.8411" y="652.0547"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.7578" x="349.8411" y="675.5498">drop the named passes (compile-error) and replan</text><polygon fill="#D6D6CE" points="449.9277,602.5078,539.5122,602.5078,551.5122,614.5078,539.5122,626.5078,449.9277,626.5078,437.9277,614.5078,449.9277,602.5078" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="498.72" y="638.9648">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.5845" x="449.9277" y="619.8271">compile errors?</text><polygon fill="#D6D6CE" points="494.72,708.4063,506.72,720.4063,494.72,732.4063,482.72,720.4063,494.72,708.4063" style="stroke:#8C391F;stroke-width:1;"/><rect fill="none" height="568.2188" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="989.4399" x="6" y="754.4063"/><path d="M227.6943,754.4063 L227.6943,763.7578 L217.6943,773.7578 L6,773.7578" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="211.6943" x="9" y="768.9014">Frame time: each presented frame</text><line style="stroke:#4A3F39;stroke-width:1.5;" x1="136.9163" x2="777.5388" y1="790.7578" y2="790.7578"/><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="237.8325" x="18" y="810.7578"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4917" x="28" y="834.2529">external route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8325" x="28" y="850.6045">VideoFrame -&gt; importExternalTexture</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="271.8052" x="283.8325" y="810.7578"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.0508" x="293.8325" y="834.2529">plane route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.8052" x="293.8325" y="850.6045">worker copy -&gt; writeTexture into uint planes</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="387.8022" x="583.6377" y="810.7578"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6753" x="593.6377" y="834.2529">GPU decode route</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.8022" x="593.6377" y="850.6045">packet -&gt; GPUVideoDecodeSession compute -&gt; frame pool slot</text><line style="stroke:#4A3F39;stroke-width:1.5;" x1="136.9163" x2="777.5388" y1="883.4609" y2="883.4609"/><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="311.9414" x="338.7493" y="903.4609"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.646" x="348.7493" y="926.9561">PresentationExecutor.encode(encoder, frame)</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.9414" x="348.7493" y="943.3076">one uniform write, one encode per pass, no submit</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="333.1426" x="328.1487" y="976.1641"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1426" x="338.1487" y="999.6592">SIGNAL, fixed and authorized: source -&gt; 'source' RGB</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="278.6733" x="355.3833" y="1032.5156"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6733" x="365.3833" y="1056.0107">RGB and PRESCALE passes, at source size</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="395.4004" x="297.0198" y="1088.8672"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.4004" x="307.0198" y="1112.3623">SCALE: built-in bilinear or one user scaler -&gt; the output rectangle</text><rect fill="#EFEFE9" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="202.7935" x="393.3232" y="1145.2188"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7935" x="403.3232" y="1168.7139">OUTPUT passes, at output size</text><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="251.2261" x="369.1069" y="1201.5703"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2261" x="379.1069" y="1225.0654">remaining color steps + dither -&gt; canvas</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="275.0679" x="357.186" y="1257.9219"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.1226" x="367.186" y="1281.417">presenter submits once</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0679" x="367.186" y="1297.7686">new frames advance history, redraws do not</text><ellipse cx="494.72" cy="1353.625" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="494.72" cy="1353.625" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="494.72" x2="494.72" y1="177.0781" y2="213.4609"/><polygon fill="#4A3F39" points="490.72,203.4609,494.72,213.4609,498.72,203.4609,494.72,207.4609