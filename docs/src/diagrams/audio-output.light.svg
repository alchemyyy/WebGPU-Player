<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1165px" preserveAspectRatio="none" style="width:981px;height:1165px;" version="1.1" viewBox="0 0 981 1165" width="981px" zoomAndPan="magnify"><defs/><g><ellipse cx="505.0997" cy="15" fill="#8C391F" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="324.2114" x="342.994" y="45"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5698" x="352.994" y="68.4951">selectPlaybackAudio:</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2114" x="352.994" y="84.8467">DefaultAudioStreamIndex, else the first audio stream</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="406.5024" x="301.8485" y="117.7031"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5024" x="311.8485" y="141.1982">Normalization gain G = 10^(dB / 20) from TrackGain or AlbumGain,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.3887" x="311.8485" y="157.5498">each falling back to the other; unity when Off or missing</text><polygon fill="#D6D6CE" points="363.8485,190.4063,646.351,190.4063,658.351,206.7578,646.351,223.1094,363.8485,223.1094,351.8485,206.7578,363.8485,190.4063" style="stroke:#8C391F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5024" x="363.8485" y="203.9014">AC-3 or E-AC-3, 2 or 6 channels, exactly 48 kHz,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.7788" x="363.8485" y="220.2529">and the MSE probe passed?</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="283.8094" y="204.1211">native media</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.043" x="658.351" y="204.1211">decoded PCM</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="324.9033" x="95.2861" y="233.1094"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2217" x="105.2861" y="256.6045">Worker remuxes the track to fMP4</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9033" x="105.2861" y="272.9561">(2 MiB or 2 s segments, 2 credits, at most 6 s ahead)</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="503.4756" x="6" y="320.8125"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.4756" x="16" y="344.3076">CustomDecodeNativeAudioBridge appends to a hidden audio element through MSE</text><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="248.2744" x="133.6006" y="392.1641"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.2744" x="143.6006" y="415.6592">element.volume = min(volume^3 * G, 1)</text><rect fill="#F0DBAE" height="69.0547" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="445.9722" x="529.4756" y="233.1094"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.8369" x="539.4756" y="256.6045">Decode: WebCodecs or Mediabunny's PCM in the decode worker,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.1567" x="539.4756" y="272.9561">or, for a codec no engine decoder decodes, the first of the</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.9722" x="539.4756" y="289.3076">host's audio decoder packages that accepts it, in the audio decode worker</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="341.5786" x="581.6724" y="337.1641"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.6777" x="591.6724" y="360.6592">The decode worker sends packets or decoded samples</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.5786" x="591.6724" y="377.0107">in 40 ms batches, 4 in flight, to the audio decode worker</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="325.7285" x="589.5974" y="424.8672"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.7285" x="599.5974" y="448.3623">Bind the output stage to the decoded rate and layout,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.5151" x="599.5974" y="464.7139">and rebind on a later change</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="412.3105" x="546.3064" y="497.5703"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.3105" x="556.3064" y="521.0654">Reconcile timestamps within 2 s: fill gaps with silence, trim overlaps,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4688" x="556.3064" y="537.417">a larger deviation fails as decode-failed</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="317.7114" x="593.606" y="619.8203"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.7114" x="603.606" y="643.3154">Stereo output: downmix with the selected algorithm,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.8169" x="603.606" y="659.667">5.1 or 7.1 output: map by channel name</text><polygon fill="#D6D6CE" points="619.4941,570.2734,885.4292,570.2734,897.4292,582.2734,885.4292,594.2734,619.4941,594.2734,607.4941,582.2734,619.4941,570.2734" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="756.4617" y="606.7305">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9351" x="619.4941" y="587.5928">Decoded layout differs from the output layout?</text><polygon fill="#D6D6CE" points="752.4617,692.5234,764.4617,704.5234,752.4617,716.5234,740.4617,704.5234,752.4617,692.5234" style="stroke:#8C391F;stroke-width:1;"/><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="137.0508" x="683.9363" y="736.5234"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0508" x="693.9363" y="760.0186">Resample to 48 kHz</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="232.4243" x="636.2495" y="792.875"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4243" x="646.2495" y="816.3701">Lookahead limiter (100 ms, -1 dBFS)</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="248.3315" x="628.2959" y="849.2266"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3315" x="638.2959" y="872.7217">40 ms to 12000-frame chunks, 8 credits</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="348.0913" x="578.416" y="905.5781"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0034" x="588.416" y="929.0732">WorkletPCMProducer -&gt; AudioWorklet 2 s ring,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0913" x="588.416" y="945.4248">over the channel CustomDecodeAudioBridge hands over</text><rect fill="#CCE3CF" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="252.6416" x="626.1409" y="978.2813"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.6416" x="636.1409" y="1001.7764">Worklet gain = volume^3 * G, uncapped,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4897" x="636.1409" y="1018.1279">clipped samples are counted</text><polygon fill="#D6D6CE" points="505.0997,1036.9844,517.0997,1048.9844,505.0997,1060.9844,493.0997,1048.9844,505.0997,1036.9844" style="stroke:#8C391F;stroke-width:1;"/><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="352.3823" x="328.9086" y="1080.9844"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.3823" x="338.9086" y="1104.4795">WebGPUAudioOutputManager routes the sink (setSinkId)</text><ellipse cx="505.0997" cy="1148.3359" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="505.0997" cy="1148.3359" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="505.0997" x2="505.0997" y1="25" y2="45"/><polygon fill="#4A3F39" points="501.0997,35,505.0997,45,509.0997,35,505.0997,39" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="505.0997" x2="505.0997" y1="97.7031" y2="117.7031"/><polygon fill="#4A3F39" points="501.0997,107.7031,505.0997,117.7031,509.0997,107.7031,505.0997,111.7031" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="257.7378" x2="257.7378" y1="285.8125" y2="320.8125"/><polygon fill="#4A3F39" points="253.7378,310.8125,257.7378,320.8125,261.7378,310.8125,257.7378,314.8125" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="257.7378" x2="257.7378" y1="357.1641" y2="392.1641"/><polygon fill="#4A3F39" points="253.7378,382.1641,257.7378,392.1641,261.7378,382.1641,257.7378,386.1641" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="752.4617" x2="752.4617" y1="302.1641" y2="337.1641"/><polygon fill="#4A3F39" points="748.4617,327.1641,752.4617,337.1641,756.4617,327.1641,752.4617,331.1641" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="752.4617" x2="752.4617" y1="389.8672" y2="424.8672"/><polygon fill="#4A3F39" points="748.4617,414.8672,752.4617,424.8672,756.4617,414.8672,752.4617,418.8672" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="752.4617" x2="752.4617" y1="477.5703" y2="497.5703"/><polygon fill="#4A3F39" points="748.4617,487.5703,752.4617,497.5703,756.4617,487.5703,752.4617,491.5703" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="752.4617" x2="752.4617" y1="594.2734" y2="619.8203"/><polygon fill="#4A3F39" points="748.4617,609.8203,752.4617,619.8203,756.4617,609.8203,752.4617,613.8203" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="897.4292" x2="921.3174" y1="582.2734" y2="582.2734"/><polygon fill="#4A3F39" points="917.3174,636.1719,921.3174,646.1719,925.3174,636.1719,921.3174,640.1719" style="stroke:#4A3F39;stroke-width:1.5;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="921.3174" x2="921.3174" y1="582.2734" y2="704.5234"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="921.3174" x2="764.4617" y1="704.5234" y2="704.5234"/><polygon fill="#4A3F39" points="774.4617,700.5234,764.4617,704.5234,774.4617,708.5234,770.4