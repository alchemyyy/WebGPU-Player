PlaybackEligibility,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.123" x="81.4009" y="172.5352">once the needed route keys settle</text></g><path d="M79,206.1719 L79,240.1719 A3,3 0 0 0 82,243.1719 L286,243.1719 A3,3 0 0 0 289,240.1719 L289,213.1719 L279,203.1719 L82,203.1719 A3,3 0 0 0 79,206.1719" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M279,203.1719 L279,211.6719 A1.5,1.5 0 0 0 280.5,213.1719 L289,213.1719 L279,203.1719" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.75" x="85" y="220.6289">The host's setup bound ends where</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105.375" x="85" y="235.7227">the controller starts.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg4"><polygon fill="#4A3F39" points="318.5317,280.5469,328.5317,284.5469,318.5317,288.5469,322.5317,284.5469" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="74.4009" x2="324.5317" y1="284.5469" y2="284.5469"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.1309" x="81.4009" y="264.8164">push mode on a source-less video element;</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.4688" x="81.4009" y="279.9102">install shaders, authorize the selected route</text></g><g class="message" data-entity-1="part1" data-entity-2="part3" id="msg5"><polygon fill="#4A3F39" points="502.7639,309.6406,512.7639,313.6406,502.7639,317.6406,506.7639,313.6406" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="74.4009" x2="508.7639" y1="313.6406" y2="313.6406"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="22.0137" x="81.4009" y="309.0039">play</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg6"><line style="stroke:#4A3F39;stroke-width:1.5;" x1="524.7639" x2="566.7639" y1="357.8281" y2="357.8281"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="566.7639" x2="566.7639" y1="357.8281" y2="370.8281"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="525.7639" x2="566.7639" y1="370.8281" y2="370.8281"/><polygon fill="#4A3F39" points="535.7639,366.8281,525.7639,370.8281,535.7639,374.8281,531.7639,370.8281" style="stroke:#4A3F39;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.4141" x="531.7639" y="338.0977">new generation, reset clock,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.6836" x="531.7639" y="353.1914">emit 'waiting', start the startup bound</text></g><path d="M529,386.8281 L529,435.8281 A3,3 0 0 0 532,438.8281 L775,438.8281 A3,3 0 0 0 778,435.8281 L778,393.8281 L768,383.8281 L532,383.8281 A3,3 0 0 0 529,386.8281" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M768,383.8281 L768,392.3281 A1.5,1.5 0 0 0 769.5,393.8281 L778,393.8281 L768,383.8281" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.1113" x="535" y="401.2852">Fails after 20 s without decode progress,</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.7852" x="535" y="416.3789">or at 60 s regardless; the fallback message</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.7598" x="535" y="431.4727">names the counters it reached.</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg7"><polygon fill="#4A3F39" points="801.5549,461.2031,811.5549,465.2031,801.5549,469.2031,805.5549,465.2031" style="stroke:#4