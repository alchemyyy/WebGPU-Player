><line style="stroke:#4A3F39;stroke-width:1.5;stroke-dasharray:2,2;" x1="419.4248" x2="780.9189" y1="658.9453" y2="658.9453"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.4824" x="431.4248" y="654.3086">parser_event_pointer / parser_event_count</text></g><path d="M419,674.9453 L419,723.9453 A3,3 0 0 0 422,726.9453 L610,726.9453 A3,3 0 0 0 613,723.9453 L613,681.9453 L603,671.9453 L422,671.9453 A3,3 0 0 0 419,674.9453" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M603,671.9453 L603,680.4453 A1.5,1.5 0 0 0 604.5,681.9453 L613,681.9453 L603,671.9453" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.707" x="425" y="689.4023">The call's events trail the packet:</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.4102" x="425" y="704.4961">they wait for the next picture,</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4258" x="425" y="719.5898">or go with the end of the track.</text><line style="stroke:#8F887F;stroke-width:1;stroke-dasharray:2,2;" x1="350.5007" x2="1210.8225" y1="733.2266" y2="733.2266"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114.8545" x="355.5007" y="746.7217">[status 2: blocked]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg12"><line style="stroke:#4A3F39;stroke-width:1.5;" x1="414.4248" x2="456.4248" y1="786.7656" y2="786.7656"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="456.4248" x2="456.4248" y1="786.7656" y2="799.7656"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="415.4248" x2="456.4248" y1="799.7656" y2="799.7656"/><polygon fill="#4A3F39" points="425.4248,795.7656,415.4248,799.7656,425.4248,803.7656,421.4248,799.7656" style="stroke:#4A3F39;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.4258" x="421.4248" y="767.0352">wait until every earlier picture finished;</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.8379" x="421.4248" y="782.1289">plan the packet again, or call plan_next again</text></g><line style="stroke:#8F887F;stroke-width:1;stroke-dasharray:2,2;" x1="350.5007" x2="1210.8225" y1="808.7656" y2="808.7656"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="299.7744" x="355.5007" y="822.2607">[status 0 or 3: a picture, with more to come on 3]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg13"><polygon fill="#4A3F39" points="425.4248,858.3047,415.4248,862.3047,425.4248,866.3047,421.4248,862.3047" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;stroke-dasharray:2,2;" x1="419.4248" x2="780.9189" y1="862.3047" y2="862.3047"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.5059" x="431.4248" y="842.5742">the plan (parser_output_pointer / _byte_length),</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.7773" x="431.4248" y="857.668">parser_plan_unit_count, the plan's events</text></g><path d="M363.5007,877.3047 L425.7117,877.3047 L425.7117,885.6563 L415.7117,895.6563 L360.5007,895.6563 L360.5007,880.3047 A3,3 0 0 1 363.5007,877.3047" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><rect fill="none" height="150.1719" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="840.3218" x="360.5007" y="877.3047"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.2109" x="375.5007" y="891.7998">opt</text><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.1709" x="440.7117" y="892.7998">[the plan has units]</text><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg14"><polygon fill="#4A3F39" points="975.0393,929.1953,985.0393,933.1953,975.0393,937.1953,979.0393,933.1953" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="414.4248" x2="981.0393" y1="933.1953" y2="933.1953"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.416" x="421.4248" y="913.4648">parse(plan, first unit, unit count),</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.8047" x="421.4248" y="928.5586">up to N nearly equal contiguous groups</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg15"><line style="stroke:#4A3F39;stroke-width:1.5;" x1="987.0393" x2="1029.0393" y1="977.3828" y2="977.3828"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1029.0393" x2="1029.0393" y1="977.3828" y2="990.3828"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="988.0393" x2="1029.0393" y1="990.3828" y2="990.3828"/><polygon fill="#4A3F39" points="998.0393,986.3828,988.0393,990.3828,998.0393,994.3828,994.0393,990.3828" style="stroke:#4A3F39;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.7832" x="994.0393" y="957.6523">parser_reserve_input, copy the plan,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.0957" x="994.0393" y="972.7461">parser_parse(handle, n, first, count)</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg16"><polygon fill="#4A3F39" points="425.4248,1015.4766,415.4248,1019.4766,425.4248,1023.4766,421.4248,1019.4766" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;stroke-dasharray:2,2;" x1="419.4248" x2="986.0393" y1="1019.4766" y2="1019.4766"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7773" x="431.4248" y="1014.8398">one job per group (the output)</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg17"><line style="stroke:#4A3F39;stroke-width:1.5;" x1="414.4248" x2="456.4248" y1="1055.5703" y2="1055.5703"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="456.4248" x2="456.4248" y1="1055.5703" y2="1068.5703"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="415.4248" x2="456.4248" y1="1068.5703" y2="1068.5703"/><polygon fill="#4A3F39" points="425.4248,1064.5703,415.4248,1068.5703,425.4248,1072.5703,421.4248,1068.5703" style="stroke:#4A3F39;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.0918" x="421.4248" y="1050.9336">wait until every earlier picture finished</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg18"><polygon fill="#4A3F39" points="769.9189,1108.7578,779.9189,1112.7578,769.9189,1116.7578,773.9189,1112.7578" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="414.4248" x2="775.9189" y1="1112.7578" y2="1112.7578"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.8125" x="421.4248" y="1093.0273">parser_reserve_input, copy the jobs in unit order,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.0703" x="421.4248" y="1108.1211">parser_finish(handle, n)</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg19"><polygon fill="#4A3F39" points="425.4248,1183.1328,415.4248,1187.1328,425.4248,1191.1328,421.4248,1187.1328" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;stroke-dasharray:2,2;" x1="419.4248" x2="780.9189" y1="1187.1328" y2="1187.1328"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.084" x="431.4248" y="1137.2148">the GPU record (the output), the finish's events,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.0977" x="431.4248" y="1152.3086">parser_picture_width / _height,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="288.8379" x="431.4248" y="1167.4023">parser_picture_repeat_count for each repeat directive,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="343.4941" x="431.4248" y="1182.4961">parser_picture_format, parser_maximum_picture_width / _height</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg20"><polygon fill="#4A3F39" points="127.8777,1271.5078,117.8777,1275.5078,127.8777,1279.5078,123.8777,1275.5078" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;stroke-dasharray:2,2;" x1="121.8777" x2="413.4248" y1="1275.5078" y2="1275.5078"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.7539" x="133.8777" y="1225.5898">the packet's pictures in decode order: record,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.125" x="133.8777" y="1240.6836">plan events then finish events, visible size,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.7715" x="133.8777" y="1255.7773">repeat counts, format, sequence maximum;</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7441" x="133.8777" y="1270.8711">then the trailing events</text></g><g class="message" data-entity-1="part1" data-entity-2="part5" id="msg21"><polygon fill="#4A3F39" points="1253.7656,1330.7891,1263.7656,1334.7891,1253.7656,1338.7891,1257.7656,1334.7891" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="116.8777" x2="1259.7656" y1="1334.7891" y2="1334.7891"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.4629" x="123.8777" y="1299.9648">one packet and one credit per picture,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.4375" x="123.8777" y="1315.0586">with the packet's timestamp, duration, and keyframe flag:</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="303.4629" x="123.8777" y="1330.1523">the record, carried events first, then its own (at most 256)</text></g><path d="M1270,1350.7891 L1270,1399.7891 A3,3 0 0 0 1273,1402.7891 L1596,1402.7891 A3,3 0 0 0 1599,1399.7891 L1599,1357.7891 L1589,1347.7891 L1273,1347.7891 A3,3 0 0 0 1270,1350.7891" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><path d="M1589,1347.7891 L1589,1356.2891 A1.5,1.5 0 0 0 1590.5,1357.7891 L1599,1357.7891 L1589,1347.7891" fill="#D6D6CE" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="308.8477" x="1276" y="1365.2461">GPUVideoDecodeFeed hands a picture of another format,</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258.8203" x="1276" y="1380.3398">or beyond the pool, to a new session made for it,</text><text fill="#262625" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="284.8184" x="1276" y="1395.4336">which takes over once this one presented its pictures.</text><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg22"><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1265.7656" x2="1307.7656" y1="1459.3516" y2="1459.3516"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1307.7656" x2="1307.7656" y1="1459.3516" y2="1472.3516"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1266.7656" x2="1307.7656" y1="1472.3516" y2="1472.3516"/><polygon fill="#4A3F39" points="1276.7656,1468.3516,1266.7656,1472.3516,1276.7656,1476.3516,1272.7656,1472.3516" style="stroke:#4A3F39;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="317.5195" x="1272.7656" y="1424.5273">write the record into the packet ring, encode the dispatches,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.043" x="1272.7656" y="1439.6211">each repeat min(the picture's count, the stream's) times,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.0645" x="1272.7656" y="1454.7148">read the status back</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg23"><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1265.7656" x2="1307.7656" y1="1531.6328" y2="1531.6328"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1307.7656" x2="1307.7656" y1="1531.6328" y2="1544.6328"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1266.7656" x2="1307.7656" y1="1544.6328" y2="1544.6328"/><polygon fill="#4A3F39" points="1276.7656,1540.6328,1266.7656,1544.6328,1276.7656,1548.6328,1272.7656,1544.6328" style="stroke:#4A3F39;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="325.5293" x="1272.7656" y="1496.8086">each event presents or drops the undecided picture it names;</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="289.3652" x="1272.7656" y="1511.9023">a frame's visible rectangle is its picture's reported size,</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.4238" x="1272.7656" y="1526.9961">scaled into the display area</text></g><rect fill="#EFEFE9" height="3" rx="3" ry="3" style="stroke:#EFEFE9;stroke-width:1;" width="1600.2949" x="5" y="1573.8086"/><line style="stroke:#8C391F;stroke-width:0.5;" x1="5" x2="1605.2949" y1="1573.8086" y2="1573.8086"/><line style="stroke:#8C391F;stroke-width:0.5;" x1="5" x2="1605.2949" y1="1576.8086" y2="1576.8086"/><rect fill="#EFEFE9" height="24.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="115.8481" x="747.2234" y="1562.6328"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.2363" x="753.2234" y="1580.1279">End of the track</text><g class="message" data-entity-1="part1" data-entity-2="part5" id="msg24"><polygon fill="#4A3F39" points="1253.7656,1614.0781,1263.7656,1618.0781,1253.7656,1622.0781,1257.7656,1618.0781" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="116.8777" x2="1259.7656" y1="1618.0781" y2="1618.0781"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.4785" x="123.8777" y="1613.4414">video-ended with the events no picture carried</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg25"><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1265.7656" x2="1307.7656" y1="1662.2656" y2="1662.2656"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1307.7656" x2="1307.7656" y1="1662.2656" y2="1675.2656"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="1266.7656" x2="1307.7656" y1="1675.2656" y2="1675.2656"/><polygon fill="#4A3F39" points="1276.7656,1671.2656,1266.7656,1675.2656,1276.7656,1679.2656,1272.7656,1675.2656" style="stroke:#4A3F39;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.8145" x="1272.7656" y="1642.5352">apply them, then present the undecided</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.377" x="1272.7656" y="1657.6289">frames in timestamp order</text></g><rect fill="#EFEFE9" height="3" rx="3