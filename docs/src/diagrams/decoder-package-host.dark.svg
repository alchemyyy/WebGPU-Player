<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1594px" preserveAspectRatio="none" style="width:951px;height:1594px;" version="1.1" viewBox="0 0 951 1594" width="951px" zoomAndPan="magnify"><defs/><g><ellipse cx="475.948" cy="15" fill="#3473AD" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="none" height="748.8594" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="398.3308" x="283.9456" y="35"/><path d="M480.3191,35 L480.3191,44.3516 L470.3191,54.3516 L283.9456,54.3516" fill="none" style="stroke:#4A5056;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="186.3735" x="286.9456" y="49.4951">When the host gets a package</text><rect fill="#22405E" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="343.9399" x="303.978" y="71.3516"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.9399" x="313.978" y="94.8467">Read the file's bytes: a user's pick, the host's own asset,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.6079" x="313.978" y="111.1982">or DecoderPackageStore.loadAll</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="184.0361" x="383.9299" y="144.0547"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.0361" x="393.9299" y="167.5498">loadDecoderPackage(bytes)</text><rect fill="#4A2121" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="268.5806" x="341.6577" y="249.9531"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.0361" x="351.6577" y="273.4482">Report its code and detail,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5806" x="351.6577" y="289.7998">such as package-import: env.abort function</text><ellipse cx="475.948" cy="333.6563" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="475.948" cy="333.6563" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#181B1D" points="408.0249,200.4063,543.8711,200.4063,555.8711,212.4063,543.8711,224.4063,408.0249,224.4063,396.0249,212.4063,408.0249,200.4063" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="479.948" y="236.8633">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.8462" x="408.0249" y="217.7256">DecoderPackageError?</text><rect fill="#1D3B2C" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="364.0049" x="293.9456" y="386.6563"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.0049" x="303.9456" y="410.1514">Keep the VideoDecoderPackage or AudioDecoderPackage,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2134" x="303.9456" y="426.5029">in the order the host prefers them</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="325.6333" x="313.1313" y="508.9063"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6333" x="323.1313" y="532.4014">verifyGPUDecoderPackage(device, package, format)</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.4688" x="323.1313" y="548.7529">for each of getGPUDecoderVectorFormats(package)</text><rect fill="#4A2121" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="233.186" x="359.355" y="631.1563"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.186" x="369.355" y="654.6514">The host may leave the package out,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.5088" x="369.355" y="671.0029">as the engine never decides for it</text><polygon fill="#181B1D" points="451.373,581.6094,500.5229,581.6094,512.5229,593.6094,500.5229,605.6094,451.373,605.6094,439.373,593.6094,451.373,581.6094" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="479.948" y="618.0664">no</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.1499" x="451.373" y="598.9287">passed?</text><polygon fill="#181B1D" points="475.948,703.8594,487.948,715.8594,475.948,727.8594,463.948,715.8594,475.948,703.8594" style="stroke:#3473AD;stroke-width:1;"/><polygon fill="#181B1D" points="312.6196,459.3594,639.2764,459.3594,651.2764,471.3594,639.2764,483.3594,312.6196,483.3594,300.6196,471.3594,312.6196,459.3594" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="479.948" y="495.8164">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.6567" x="312.6196" y="476.6787">The host wants a video package checked on the device?</text><polygon fill="#181B1D" points="475.948,747.8594,487.948,759.8594,475.948,771.8594,463.948,759.8594,475.948,747.8594" style="stroke:#3473AD;stroke-width:1;"/><rect fill="none" height="752.293" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="939.896" x="6" y="793.8594"/><path d="M106.3271,793.8594 L106.3271,803.2109 L96.3271,813.2109 L6,813.2109" fill="none" style="stroke:#4A5056;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="90.3271" x="9" y="808.3545">Each playback</text><rect fill="#4F3B14" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="426.4404" x="262.7278" y="830.2109"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.9204" x="272.7278" y="853.7061">getGPUVideoDecoderOffers(presenter, video packages, options):</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.4404" x="272.7278" y="870.0576">packages whose accepts names the stream's codec and whose output</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.2227" x="272.7278" y="886.4092">lists its format, with the device's buffer limit</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="401.5703" x="275.1628" y="919.2656"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5806" x="285.1628" y="942.7607">getCustomPlaybackEligibility(options, capabilities,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.5703" x="285.1628" y="959.1123">{ gpuVideoDecoders: offers, audioDecoders: audio packages, ... })</text><polygon fill="#181B1D" points="104.0635,991.9688,290.4941,991.9688,302.4941,1003.9688,290.4941,1015.9688,104.0635,1015.9688,92.0635,1003.9688,104.0635,991.9688" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="201.2788" y="1028.4258">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4307" x="104.0635" y="1009.2881">Native WebCodecs video route?</text><rect fill="#1D3B2C" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="223.0806" x="85.7385" y="1051.0625"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0806" x="95.7385" y="1074.5576">The native route; packages unused</text><polygon fill="#181B1D" points="340.8191,987.6172,673.2268,987.6172,685.2268,1003.9688,673.2268,1020.3203,340.8191,1020.3203,328.8191,1003.9688,340.8191,987.6172" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="511.0229" y="1032.7773">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.8887" x="340.8191" y="1001.1123">An offer whose constraint takes the stream and whose</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.4077" x="340.8191" y="1017.4639">pool, state, scratch buffers, and packet ring fit the device?</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="685.2268" y="1001.332">no</text><rect fill="#1D3B2C" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="282.3232" x="365.8613" y="1055.4141"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3232" x="375.8613" y="1078.9092">frame-pool route, videoDecoderBackend gpu,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.6206" x="375.8613" y="1095.2607">gpuVideoDecoder: the first such offer</text><rect fill="#4A2121" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="160.9307" x="705.2268" y="1029.5664"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.9307" x="715.2268" y="1053.0615">Ineligible: no video route</text><ellipse cx="785.6921" cy="1111.918" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="785.6921" cy="1111.918" fill="#FFFFFF" rx="6" ry="6" style=