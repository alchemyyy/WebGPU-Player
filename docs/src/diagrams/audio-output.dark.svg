<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1165px" preserveAspectRatio="none" style="width:1055px;height:1165px;" version="1.1" viewBox="0 0 1055 1165" width="1055px" zoomAndPan="magnify"><defs/><g><ellipse cx="519.9513" cy="15" fill="#3473AD" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#22405E" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="324.2114" x="357.8456" y="45"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5698" x="367.8456" y="68.4951">selectPlaybackAudio:</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2114" x="367.8456" y="84.8467">DefaultAudioStreamIndex, else the first audio stream</text><rect fill="#22405E" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="406.5024" x="316.7001" y="117.7031"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5024" x="326.7001" y="141.1982">Normalization gain G = 10^(dB / 20) from TrackGain or AlbumGain,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.3887" x="326.7001" y="157.5498">each falling back to the other; unity when Off or missing</text><polygon fill="#181B1D" points="299.8939,190.4063,740.0087,190.4063,752.0087,206.7578,740.0087,223.1094,299.8939,223.1094,287.8939,206.7578,299.8939,190.4063" style="stroke:#3473AD;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.9731" x="299.8939" y="203.9014">AC-3 or E-AC-3, 2 or 6 channels, exactly 48 kHz, the MSE probe passed,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="440.1147" x="299.8939" y="220.2529">and no Atmos object rendering the speaker layout or binaural setting needs?</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="219.8549" y="204.1211">native media</text><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.043" x="752.0087" y="204.1211">decoded PCM</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="324.9033" x="95.2861" y="233.1094"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2217" x="105.2861" y="256.6045">Worker remuxes the track to fMP4</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9033" x="105.2861" y="272.9561">(2 MiB or 2 s segments, 2 credits, at most 6 s ahead)</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="503.4756" x="6" y="320.8125"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.4756" x="16" y="344.3076">CustomDecodeNativeAudioBridge appends to a hidden audio element through MSE</text><rect fill="#1D3B2C" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="248.2744" x="133.6006" y="392.1641"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.2744" x="143.6006" y="415.6592">element.volume = min(volume^3 * G, 1)</text><rect fill="#4F3B14" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="445.9722" x="559.1787" y="233.1094"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.8369" x="569.1787" y="256.6045">Decode: WebCodecs or Mediabunny's PCM in the decode worker,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.1567" x="569.1787" y="272.9561">or, for a codec no engine decoder decodes, the first of the</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.9722" x="569.1787" y="289.3076">host's audio decoder packages that accepts it, in the audio decode worker</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="341.5786" x="611.3755" y="337.1641"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.6777" x="621.3755" y="360.6592">The decode worker sends packets or decoded samples</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.5786" x="621.3755" y="377.0107">in 40 ms batches, 4 in flight, to the audio decode worker</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="325.7285" x="619.3005" y="424.8672"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.7285" x="629.3005" y="448.3623">Bind the output stage to the decoded rate and layout,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.5151" x="629.3005" y="464.7139">and rebind on a later change</text><rect fill="#1B2A3A" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="412.3105" x="576.0095" y="497.5703"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.3105" x="586.0095" y="521.0654">Reconcile timestamps within 2 s: fill gaps with silence, trim overlaps,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4688" x="586.0095" y="537.417">a larger deviation fails as decode-failed</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="485.3784" x="539.4756" y="619.8203"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.3784" x="549.4756" y="643.3154">Stereo output: fold heights to the floor, then downmix with the selected algorithm,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.6421" x="549.4756" y="659.667">5.1, 7.1, or height output: map by channel name, folding missing speakers</text><polygon fill="#181B1D" points="649.1973,570.2734,915.1323,570.2734,927.1323,582.2734,915.1323,594.2734,649.1973,594.2734,637.1973,582.2734,649.1973,570.2734" style="stroke:#3473AD;stroke-width:1;"/><text fill="#98A3AD" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="786.1648" y="606.7305">yes</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9351" x="649.1973" y="587.5928">Decoded layout differs from the output layout?</text><polygon fill="#181B1D" points="782.1648,692.5234,794.1648,704.5234,782.1648,716.5234,770.1648,704.5234,782.1648,692.5234" style="stroke:#3473AD;stroke-width:1;"/><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="137.0508" x="713.6394" y="736.5234"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0508" x="723.6394" y="760.0186">Resample to 48 kHz</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="232.4243" x="665.9526" y="792.875"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4243" x="675.9526" y="816.3701">Lookahead limiter (100 ms, -1 dBFS)</text><rect fill="#4F3B14" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="248.3315" x="657.999" y="849.2266"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3315" x="667.999" y="872.7217">40 ms to 12000-frame chunks, 8 credits</text><rect fill="#4F3B14" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="348.0913" x="608.1191" y="905.5781"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0034" x="618.1191" y="929.0732">WorkletPCMProducer -&gt; AudioWorklet 2 s ring,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0913" x="618.1191" y="945.4248">over the channel CustomDecodeAudioBridge hands over</text><rect fill="#1D3B2C" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="252.6416" x="655.844" y="978.2813"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.6416" x="665.844" y="1001.7764">Worklet gain = volume^3 * G, uncapped,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4897" x="665.844" y="1018.1279">clipped samples are counted</text><polygon fill="#181B1D" points="519.9513,1036.9844,531.9513,1048.9844,519.9513,1060.9844,507.9513,1048.9844,519.9513,1036.9844" style="stroke:#3473AD;stroke-width:1;"/><rect fill="#1D3B2C" height="36.3516" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="352.3823" x="343.7601" y="1080.9844"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.3823" x="353.7601" y="1104.4795">WebGPUAudioOutputManager routes the sink (setSinkId)</text><ellipse cx="519.9513" cy="1148.3359" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="519.9513" cy="1148.3359" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="519.9513" x2="519.9513" y1="25" y2="45"/><polygon fill="#8FB3D4" points="515.9513,35,519.9513,45,523.9513,35,519.9513,39" style="stroke:#8FB3D4;stroke-width:1;"/><line style="stroke:#8FB3D4;stroke-width:1.5;" x1="519.9513" x2="519.9513" y1="97.7031" y2="117.7031"/><polygon fill="#8FB3D4" points="515.951