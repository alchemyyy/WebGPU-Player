<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="788px" preserveAspectRatio="none" style="width:1412px;height:788px;" version="1.1" viewBox="0 0 1412 788" width="1412px" zoomAndPan="magnify"><defs/><g><!--cluster Host--><g class="cluster" data-qualified-name="Host" data-source-line="5" id="ent0002"><rect fill="#2B2519" height="120" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="246" x="12" y="197.5"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.8882" x="120.5559" y="212.9951">Host</text></g><!--cluster Decoder package: one .wasm file--><g class="cluster" data-qualified-name="Decoder package. one .wasm file" data-source-line="9" id="ent0004"><rect fill="#181B1D" height="136" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="738" x="62" y="12"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="204.4644" x="328.7678" y="27.4951">Decoder package: one .wasm file</text></g><!--cluster Main thread (engine)--><g class="cluster" data-qualified-name="Main thread .engine." data-source-line="15" id="ent0008"><rect fill="#1A2531" height="328" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="538" x="295" y="181"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="127.1182" x="500.4409" y="196.4951">Main thread (engine)</text></g><!--cluster Workers (engine)--><g class="cluster" data-qualified-name="Workers .engine." data-source-line="22" id="ent0013"><rect fill="#1B2A21" height="136" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="1109" x="297" y="573"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.1836" x="798.4082" y="588.4951">Workers (engine)</text></g><!--cluster GPU--><g class="cluster" data-qualified-name="GPU" data-source-line="33" id="ent0021"><rect fill="#2E2020" height="120" rx="3" ry="3" style="stroke:#4A5056;stroke-width:1;" width="242" x="899" y="381"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1709" x="1005.9146" y="396.4951">GPU</text></g><!--entity host--><g class="entity" data-qualified-name="Host.host" data-source-line="6" id="ent0003"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="212.9497" x="28.5" y="232.5"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.8882" x="38.5" y="255.9951">Host</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.2007" x="38.5" y="272.3467">fetches or stores package files,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9497" x="38.5" y="288.6982">then loadDecoderPackage(bytes)</text></g><!--entity module--><g class="entity" data-qualified-name="Decoder package. one .wasm file.module" data-source-line="10" id="ent0005"><rect fill="#202427" height="85.4063" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="240.3271" x="78" y="47"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.6963" x="88" y="70.4951">WebAssembly module</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.3271" x="88" y="86.8467">imports: env.memory, inert WASI calls</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4116" x="88" y="103.1982">exports: parser_* (video parser),</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6987" x="88" y="119.5498">audio_decoder_* (audio), or none</text></g><!--entity decoderSection--><g class="entity" data-qualified-name="Decoder package. one .wasm file.decoderSection" data-source-line="11" id="ent0006"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="224.1025" x="358" y="55"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9199" x="368" y="78.4951">webgpu-player.decoder</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8398" x="368" y="94.8467">UTF-8 text: the //! header,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.1025" x="368" y="111.1982">then a video decoder's WGSL body</text></g><!--entity vectorsSection--><g class="entity" data-qualified-name="Decoder package. one .wasm file.vectorsSection" data-source-line="12" id="ent0007"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="161.5972" x="622" y="55"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.5972" x="632" y="78.4951">webgpu-player.vectors</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.9116" x="632" y="94.8467">optional, video only:</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.0254" x="632" y="111.1982">self-test vectors</text></g><!--entity loader--><g class="entity" data-qualified-name="Main thread .engine..loader" data-source-line="16" id="ent0009"><rect fill="#202427" height="101.7578" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="236.7534" x="311.5" y="216"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.5044" x="321.5" y="239.4951">loadDecoderPackage</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7534" x="321.5" y="255.8467">compiles the module; checks imports,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2407" x="321.5" y="272.1982">memory, header, exports, vectors;</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="321.5" y="288.5498">id = the header's id: line,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.377" x="321.5" y="304.9014">content hash = SHA-256 of the file</text></g><!--entity verification--><g class="entity" data-qualified-name="Main thread .engine..verification" data-source-line="17" id="ent0010"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="187.6416" x="609" y="232.5"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.6416" x="619" y="255.9951">verifyGPUDecoderPackage</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.8799" x="619" y="272.3467">runs a self-test vector,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.2935" x="619" y="288.6982">only when a host calls it</text></g><!--entity eligibility--><g class="entity" data-qualified-name="Main thread .engine..eligibility" data-source-line="18" id="ent0011"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="170.3125" x="311" y="416"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.7827" x="321" y="439.4951">Eligibility</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3125" x="321" y="455.8467">gpuVideoDecoders offers,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.707" x="321" y="472.1982">audioDecoders packages</text></g><!--entity session--><g class="entity" data-qualified-name="Main thread .engine..session" data-source-line="19" id="ent0012"><rect fill="#202427" height="85.4063" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="216.5679" x="599.5" y="408"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="160.3799" x="609.5" y="431.4951">GPUVideoDecodeSession</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5679" x="609.5" y="447.8467">the prelude, then the WGSL body,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.4243" x="609.5" y="464.1982">per output format; packet ring,</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.1035" x="609.5" y="480.5498">dispatches, slots</text></g><!--entity audioWorker--><g class="entity" data-qualified-name="Workers .engine..audioWorker" data-source-line="23" id="ent0014"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="198.4136" x="313" y="616"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="178.4136" x="323" y="639.4951">CustomAudioDecode.worker</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.627" x="323" y="655.8467">instantiates an audio package:</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0234" x="323" y="672.1982">configure, send, receive</text></g><!--entity decodeWorker--><g class="entity" data-qualified-name="Workers .engine..decodeWorker" data-source-line="24" id="ent0015"><rect fill="#202427" height="52.7031" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="161.5908" x="627" y="624"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.5908" x="637" y="647.4951">CustomDecode.worker</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.7153" x="637" y="663.8467">demuxes the tracks</text></g><!--entity coordinatorWorker--><g class="entity" data-qualified-name="Workers .engine..coordinatorWorker" data-source-line="25" id="ent0016"><rect fill="#202427" height="85.4063" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="220.8145" x="871.5" y="608"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.8145" x="881.5" y="631.4951">GPUDecoderCoordinator.worker</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9053" x="881.5" y="647.8467">instantiates the parser</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6753" x="881.5" y="664.1982">as the coordinator:</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.8525" x="881.5" y="680.5498">configure, plan, finish</text></g><!--entity parseWorkers--><g class="entity" data-qualified-name="Workers .engine..parseWorkers" data-source-line="26" id="ent0017"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="226.6479" x="1162.5" y="616"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.8525" x="1172.5" y="639.4951">GPUDecoderParse.worker</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1836" x="1337.9644" y="639.4951">(1 to 6)</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3188" x="1172.5" y="655.8467">each instantiates the parser:</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.519" x="1172.5" y="672.1982">parse</text></g><!--entity framePool--><g class="entity" data-qualified-name="GPU.framePool" data-source-line="34" id="ent0022"><rect fill="#202427" height="69.0547" rx="3" ry="3" style="stroke:#3473AD;stroke-width:1;" width="208.6143" x="915.5" y="416"/><text fill="#D0D7DE" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0654" x="925.5" y="439.4951">Frame pool</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.479" x="925.5" y="455.8467">slots the WGSL writes;</text><text fill="#D0D7DE" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.6143" x="925.5" y="472.1982">presentation reads them in place</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="30" id="ent0019"><path d="M1159,759 L1159,778.0938 A3,3 0 0 0 1162,781.0938 L1389.7598,781.0938 A3,3 0 0 0 1392.7598,778.0938 L1392.7598,766 L1382.7598,756 L1280,756 L1276,685.05 L1272,756 L1162,756 A3,3 0 0 0 1159,759" fill="#181B1D" style="stroke:#4A5056;stroke-width:1;"/><path d="M1382.7598,756 L1382.7598,764.5 A1.5,1.5 0 0 0 1384.2598,766 L1392.7598,766 L1382.7598,756" fill="#181B1D" style="stroke:#4A5056;stroke-width:1;"/><text fill="#D0D7DE" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.7598" x="1165" y="773.457">Every instance gets a new env.memory.</text></g><!--link host to loader--><g class="link" data-entity-1="ent0003" data-entity-2="ent0009" data-link-type="dependency" data-source-line="37" id="lnk23"><path d="M241.5,267 C264.19,267 282.29,267 305.41,267" fill="none" id="host-to-loader" style="stroke:#8FB3D4;stroke-width:1.5;"/><polygon fill="#8FB3D4" points="311.41,267,302.41,263,306.41,2